<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Comedor UNMSM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <h2>🏛️ Comedor UNMSM</h2>
            <h3>Iniciar Sesión</h3>

            <!-- Mensajes de alerta (errores o éxito) -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="alert">
                  {% for message in messages %}
                    <p>{{ message }}</p>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form action="/" method="POST">
                <div class="form-group">
                    <label for="correo">Correo Institucional:</label>
                    <input type="email" id="correo" name="correo" placeholder="usuario@unmsm.edu.pe" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>

            <hr>
            <p class="text-center">¿No tienes una cuenta aún?</p>
            <a href="{{ url_for('registro') }}" class="btn-secondary">Registrar Cuenta</a>
        </div>
    </div>
</body>
</html>
