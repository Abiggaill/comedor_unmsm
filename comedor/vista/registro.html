<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Comedor UNMSM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <h2>📝 Registro de Usuario</h2>
            <p>Completa tus datos para crear tu cuenta.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                  {% for category, message in messages %}
                <div class="alert {{ 'success' if category == 'success' else '' }}">
                    <p>{{ message }}</p>
                </div>
                  {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.registro') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="dni">DNI / Código Estudiantil:</label>
                    <input type="text" id="dni" name="dni" required>
                </div>

                <div class="form-group">
                    <label for="nombres">Nombres y Apellidos:</label>
                    <input type="text" id="nombres" name="nombres" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Institucional:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn-primary">Guardar Registro</button>
            </form>

            <br>
            <a href="{{ url_for('auth.login') }}" class="link-back">← Volver al Login</a>
        </div>
    </div>
</body>
</html>
